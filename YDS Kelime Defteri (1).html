<style>
/* Düzen: tek sütunlu sözlük kolonu; üstte yapışkan gün + mod şeridi, altta içerik */
:root{
  --paper:#f3f6f4; --surface:#ffffff; --surface-2:#eef2f0;
  --ink:#132019; --muted:#5c6f67; --rule:#d9e2dd;
  --accent:#0c6b57; --accent-soft:#e2f0ea; --on-accent:#ffffff;
  --amber:#9a6a1f; --amber-soft:#f6eddc;
  --ok:#2d7a52; --ok-soft:#e3f2e8;
  --bad:#a63a2c; --bad-soft:#f8e7e3;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1513; --surface:#161e1b; --surface-2:#1d2724;
  --ink:#e6ede9; --muted:#9bada6; --rule:#2a3733;
  --accent:#54c3a5; --accent-soft:#16302a; --on-accent:#07140f;
  --amber:#d8a45c; --amber-soft:#2e2718;
  --ok:#64c08c; --ok-soft:#16301f;
  --bad:#e78a78; --bad-soft:#331c18;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0e1513; --surface:#161e1b; --surface-2:#1d2724;
  --ink:#e6ede9; --muted:#9bada6; --rule:#2a3733;
  --accent:#54c3a5; --accent-soft:#16302a; --on-accent:#07140f;
  --amber:#d8a45c; --amber-soft:#2e2718;
  --ok:#64c08c; --ok-soft:#16301f;
  --bad:#e78a78; --bad-soft:#331c18;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 56px}

/* ——— başlık ——— */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:1.45rem;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.stat{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);white-space:nowrap;font-size:.86rem;font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.daypick{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-bottom:10px}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:.78rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* ——— ortak ——— */
.sect{margin-top:22px}
.lead{color:var(--muted);font-size:.84rem;margin:0 0 14px}
.search{width:100%;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 12px;font:inherit;font-size:.9rem;margin-bottom:16px}
.search::placeholder{color:var(--muted)}

/* ——— öğren ——— */
.entries{display:flex;flex-direction:column;gap:14px}
.entry{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 16px 14px;min-width:0}
.entry.known{border-left:3px solid var(--ok)}
.entry.hard{border-left:3px solid var(--amber)}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.word{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1.1;letter-spacing:-.015em}
.ipa{font-family:var(--mono);font-size:.76rem;color:var(--muted);margin-top:2px}
.pos{display:inline-block;font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:3px;padding:2px 6px;vertical-align:middle;margin-left:8px}
.marks{display:flex;gap:6px}
.mark{border:1px solid var(--rule);background:transparent;border-radius:6px;padding:4px 9px;font-size:.74rem;color:var(--muted)}
.mark.on-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.mark.on-hard{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.tr{font-family:var(--display);font-size:1.02rem;margin:10px 0 0}
.rowlbl{font-family:var(--mono);font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 5px}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:.78rem;border:1px solid var(--rule);border-radius:99px;padding:2px 9px;background:var(--surface-2)}
.pill.anti{border-style:dashed;color:var(--muted)}
.ex{border-left:2px solid var(--rule);padding-left:12px;margin:0 0 10px}
.ex:last-child{margin-bottom:0}
.ex .en{font-size:.93rem}
.ex .en b{color:var(--accent);font-weight:600}
.ex .trn{font-size:.86rem;color:var(--muted);margin-top:2px}
.tip{margin-top:12px;background:var(--amber-soft);border-radius:7px;padding:9px 11px;font-size:.83rem}
.tip span{font-family:var(--mono);font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--amber);display:block;margin-bottom:3px}
.fam{font-size:.84rem;color:var(--muted)}
.fam i{font-style:normal;color:var(--ink);font-weight:500}

/* ——— kartlar ——— */
.cardbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:7px 13px;font-size:.84rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.4;cursor:default}
.flip{perspective:1200px;margin-bottom:14px}
.flip-in{position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.1,.2,1);min-height:230px}
.flip.open .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .big{font-family:var(--display);font-size:1.9rem;font-weight:600;line-height:1.15;text-wrap:balance}
.face .sub{font-size:.86rem;color:var(--muted)}
.hintline{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.counter{font-family:var(--mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* ——— test ——— */
.qcard{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:18px}
.qkind{font-family:var(--mono);font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.qtext{font-family:var(--display);font-size:1.18rem;margin:8px 0 16px;text-wrap:balance}
.qtext em{font-style:normal;color:var(--accent)}
.blank{font-family:var(--mono);color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--rule);background:var(--surface-2);border-radius:8px;padding:10px 13px;font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.opt .k{font-family:var(--mono);font-size:.74rem;color:var(--muted);padding-top:2px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.verdict{margin-top:14px;padding-top:13px;border-top:1px solid var(--rule);font-size:.88rem}
.verdict .vhd{font-weight:600;margin-bottom:4px}
.verdict .vhd.r{color:var(--ok)} .verdict .vhd.w{color:var(--bad)}
.verdict .ctx{color:var(--muted);margin-top:6px}
.scoreboard{text-align:center;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:28px 18px}
.scoreboard .n{font-family:var(--display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.wronglist{margin-top:18px;text-align:left;display:flex;flex-direction:column;gap:6px}
.wrongrow{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;border-bottom:1px dotted var(--rule);padding-bottom:5px}
.wrongrow span{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:.9rem}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--rule);color:var(--muted);font-size:.78rem}
</style>

  document.getElementById("daypick").innerHTML=DATA.map(d=>
    `<button class="chip" data-day="${d.id}" aria-pressed="${d.id===dayId}">${esc(d.label)}</button>`).join("")+
    `<span class="chip" style="border-style:dashed">${esc(day().date)}</span>`;
  document.getElementById("modes").innerHTML=MODES.map(m=>
    `<button class="tab" role="tab" data-mode="${m.id}" aria-selected="${m.id===mode}">${m.t}</button>`).join("");
  const ws=day().words, known=ws.filter(w=>prog[w.w]==="known").length;
  const hard=ALL.filter(w=>prog[w.w]==="hard").length;
  document.getElementById("stat").textContent=`${ws.length} kelime · ${known} öğrenildi · ${hard} zor`;
  document.getElementById("bar").style.width=ws.length?(known/ws.length*100)+"%":"0";
}

/* ——— öğren ——— */
function viewOgren(){
  const list=scope().filter(w=>!query||w.w.includes(query)||w.tr.join(" ").toLowerCase().includes(query));
  if(!scope().length) return `<div class="empty">Burada henüz kelime yok. Zor olarak işaretlediğin kelimeler bu listede toplanır.</div>`;
  return `<div class="sect">
    <input class="search" id="q" placeholder="Kelime veya Türkçe anlam ara…" value="${esc(query)}">
    <div class="entries">${list.map(entry).join("")||`<div class="empty">Eşleşen kelime yok.</div>`}</div></div>`;
}
function entry(w){
  const st=prog[w.w];
  return `<article class="entry ${st==="known"?"known":st==="hard"?"hard":""}">
    <div class="hd">
      <div><div class="word">${esc(w.w)}<span class="pos">${esc(w.pos)}</span></div>
      <div class="ipa">${esc(w.ipa)}</div></div>
      <div class="marks">
        <button class="mark ${st==="known"?"on-ok":""}" data-m="known" data-w="${esc(w.w)}">✓ Biliyorum</button>
        <button class="mark ${st==="hard"?"on-hard":""}" data-m="hard" data-w="${esc(w.w)}">★ Zor</button>
      </div>
    </div>
    <p class="tr">${w.tr.map(esc).join(" · ")}</p>
    <div class="rowlbl">Eş anlamlılar</div>
    <div class="pills">${w.syn.map(s=>`<span class="pill">${esc(s)}</span>`).join("")}
      ${w.ant.map(s=>`<span class="pill anti">≠ ${esc(s)}</span>`).join("")}</div>
    <div class="rowlbl">Örnek cümleler</div>
    ${w.ex.map(e=>`<div class="ex"><div class="en">${bold(e.en)}</div><div class="trn">${esc(e.tr)}</div></div>`).join("")}
    <div class="rowlbl">Kelime ailesi</div>
    <div class="fam">${w.fam.map(f=>`<i>${esc(f.split(" ")[0])}</i> ${esc(f.slice(f.indexOf(" ")+1))}`).join(" · ")}</div>
    <div class="tip"><span>İpucu</span>${esc(w.tip)}</div>
  </article>`;
}

/* ——— kartlar ——— */
let deck=[], ci=0, flipped=false, dir="en";
function viewKart(){
  const ws=scope();
  if(!ws.length) return `<div class="empty">Kart yok. Önce bir gün seç ya da kelime işaretle.</div>`;
  if(!deck.length||deck.some(w=>!ws.includes(w))||deck.length!==ws.length){deck=shuffle(ws);ci=0;flipped=false}
  const w=deck[ci];
  const front=dir==="en"?esc(w.w):esc(w.tr[0]);
  const fsub=dir==="en"?esc(w.ipa):"Türkçe → İngilizce";
  const back=dir==="en"?esc(w.tr.join(" · ")):esc(w.w);
  const st=prog[w.w];
  return `<div class="sect">
    <div class="cardbar">
      <button class="btn" id="dir">${dir==="en"?"EN → TR":"TR → EN"}</button>
      <button class="btn" id="sh">Karıştır</button>
      <span class="counter">${ci+1} / ${deck.length}</span>
    </div>
    <div class="flip ${flipped?"open":""}" id="flip">
      <div class="flip-in">
        <div class="face"><div class="hintline">Çevirmek için dokun</div><div class="big">${front}</div><div class="sub">${fsub}</div></div>
        <div class="face back">
          <div class="big">${back}</div>
          <div class="sub">${esc(plain(w.ex[0].en))}</div>
          <div class="sub" style="color:var(--accent)">${esc(w.syn.slice(0,3).join(", "))}</div>
        </div>
      </div>
    </div>
    <div class="cardbar">
      <button class="btn" id="prev" ${ci===0?"disabled":""}>← Önceki</button>
      <button class="mark ${st==="known"?"on-ok":""}" data-m="known" data-w="${esc(w.w)}" style="padding:7px 13px">✓ Biliyorum</button>
      <button class="mark ${st==="hard"?"on-hard":""}" data-m="hard" data-w="${esc(w.w)}" style="padding:7px 13px">★ Zor</button>
      <button class="btn primary" id="next" style="margin-left:auto">${ci===deck.length-1?"Başa dön":"Sonraki →"}</button>
    </div></div>`;
}

/* ——— test ——— */
let quiz=null;
function sameEnding(a,b){const e=s=>/(ed|ing|s)$/.exec(s.toLowerCase())?.[1]||"";return e(a)===e(b)}
function qMeaning(w,pool){
  const d=pick(pool.filter(x=>x!==w),3).map(x=>x.tr[0]);
  return {kind:"Anlam",text:`<em>${esc(w.w)}</em> kelimesinin anlamı nedir?`,opts:shuffle([w.tr[0],...d]),ans:w.tr[0],w};
}
function qReverse(w,pool){
  const d=pick(pool.filter(x=>x!==w),3).map(x=>x.w);
  return {kind:"Türkçe → İngilizce",text:`“${esc(w.tr[0])}” karşılığı hangisidir?`,opts:shuffle([w.w,...d]),ans:w.w,w};
}
function qSyn(w,pool){
  const right=pick(w.syn,1)[0];
  const others=pool.filter(x=>x!==w).flatMap(x=>x.syn).filter(s=>!w.syn.includes(s));
  return {kind:"Eş anlamlı",text:`<em>${esc(w.w)}</em> ile anlamca en yakın kelime hangisidir?`,opts:shuffle([right,...pick([...new Set(others)],3)]),ans:right,w};
}
function qCloze(w,pool){
  const ex=pick(w.ex,1)[0], form=target(ex.en);
  const cands=pool.filter(x=>x!==w).flatMap(x=>x.ex.map(e=>target(e.en)));
  const matched=[...new Set(cands.filter(c=>sameEnding(c,form)))];
  const rest=[...new Set(cands.filter(c=>!matched.includes(c)))];
  const d=[...pick(matched,3),...pick(rest,3)].slice(0,3);
  return {kind:"Boşluk doldurma",text:esc(ex.en).replace(/\{\{.+?\}\}/,'<span class="blank">______</span>'),
          opts:shuffle([form,...d]),ans:form,w,ctx:ex.tr};
}
function buildQuiz(n){
  const ws=scope(); if(ws.length<2) return null;
  const pool=ALL.length>=5?ALL:ws;
  let qs=[];
  ws.forEach(w=>{
    qs.push(qMeaning(w,pool));
    qs.push(Math.random()<.5?qSyn(w,pool):qCloze(w,pool));
    if(Math.random()<.4) qs.push(qReverse(w,pool));
  });
  return {qs:shuffle(qs).slice(0,n),i:0,score:0,wrong:[],picked:null};
}
function viewTest(){
  const ws=scope();
  if(ws.length<2) return `<div class="empty">Test için en az 2 kelime gerekiyor.</div>`;
  if(!quiz) return `<div class="sect"><p class="lead">${ws.length} kelimeden soru üretilir: anlam, eş anlamlı, boşluk doldurma ve Türkçe→İngilizce karışık gelir.</p>
    <div class="cardbar"><button class="btn primary" data-start="10">10 soruluk test</button>
    <button class="btn" data-start="20">20 soruluk test</button>
    <button class="btn" data-start="999">Tümü</button></div></div>`;
  if(quiz.i>=quiz.qs.length){
    const pct=Math.round(quiz.score/quiz.qs.length*100);
    return `<div class="sect"><div class="scoreboard">
      <div class="n">${quiz.score}/${quiz.qs.length}</div>
      <p class="lead" style="margin:8px 0 0">%${pct} doğru</p>
      ${quiz.wrong.length?`<div class="wronglist">${[...new Set(quiz.wrong.map(x=>x.w))].map(w=>{
        const o=ALL.find(x=>x.w===w);return `<div class="wrongrow"><b>${esc(w)}</b><span>${esc(o.tr[0])}</span></div>`}).join("")}</div>
      <div class="cardbar" style="margin-top:16px;justify-content:center"><button class="btn" id="markwrong">Yanlışları “zor” işaretle</button>
      <button class="btn primary" id="again">Yeniden</button></div>`:
      `<p class="lead" style="margin-top:10px">Hepsi doğru.</p><div class="cardbar" style="justify-content:center;margin-top:14px"><button class="btn primary" id="again">Yeniden</button></div>`}
    </div></div>`;
  }
  const q=quiz.qs[quiz.i], p=quiz.picked;
  return `<div class="sect">
    <div class="cardbar"><span class="counter">Soru ${quiz.i+1} / ${quiz.qs.length}</span>
      <span class="counter" style="margin-left:auto">Doğru: ${quiz.score}</span></div>
    <div class="qcard">
      <div class="qkind">${q.kind}</div>
      <div class="qtext">${q.text}</div>
      <div class="opts">${q.opts.map((o,k)=>{
        let cls="";
        if(p!==null){ if(o===q.ans)cls=" right"; else if(o===p)cls=" wrong"; }
        return `<button class="opt${cls}" data-opt="${esc(o)}" ${p!==null?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`}).join("")}</div>
      ${p!==null?`<div class="verdict">
        <div class="vhd ${p===q.ans?"r":"w"}">${p===q.ans?"Doğru":"Yanlış — doğrusu: "+esc(q.ans)}</div>
        <div><b>${esc(q.w.w)}</b> — ${esc(q.w.tr.join(" · "))}</div>
        <div class="ctx">${bold(q.w.ex[0].en)}<br>${esc(q.w.ex[0].tr)}</div>
        <div class="cardbar" style="margin:14px 0 0"><button class="btn primary" id="nextq">${quiz.i===quiz.qs.length-1?"Sonucu gör":"Sonraki soru"}</button></div>
      </div>`:""}
    </div></div>`;
}

/* ——— render + olaylar ——— */
function render(){
  chrome();
  const v=document.getElementById("view");
  v.innerHTML= mode==="kart"?viewKart() : mode==="test"?viewTest() : viewOgren();
  const q=document.getElementById("q");
  if(q){q.addEventListener("input",e=>{query=e.target.value.toLowerCase();
    const list=scope().filter(w=>!query||w.w.includes(query)||w.tr.join(" ").toLowerCase().includes(query));
    document.querySelector(".entries").innerHTML=list.map(entry).join("")||`<div class="empty">Eşleşen kelime yok.</div>`;});}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button, .flip");
  if(!t) return;
  if(t.dataset.day){dayId=+t.dataset.day;deck=[];quiz=null;query="";render();return}
  if(t.dataset.mode){mode=t.dataset.mode;deck=[];quiz=null;query="";render();return}
  if(t.dataset.m){const w=t.dataset.w;prog[w]=prog[w]===t.dataset.m?undefined:t.dataset.m;if(!prog[w])delete prog[w];save();render();return}
  if(t.id==="flip"){flipped=!flipped;document.getElementById("flip").classList.toggle("open",flipped);return}
  if(t.id==="next"){ci=(ci+1)%deck.length;flipped=false;render();return}
  if(t.id==="prev"){ci=Math.max(0,ci-1);flipped=false;render();return}
  if(t.id==="sh"){deck=shuffle(deck);ci=0;flipped=false;render();return}
  if(t.id==="dir"){dir=dir==="en"?"tr":"en";flipped=false;render();return}
  if(t.dataset.start){quiz=buildQuiz(+t.dataset.start);render();return}
  if(t.dataset.opt!==undefined&&quiz&&quiz.picked===null){
    const q=quiz.qs[quiz.i];quiz.picked=t.dataset.opt;
    if(quiz.picked===q.ans)quiz.score++;else quiz.wrong.push({w:q.w.w});
    render();return}
  if(t.id==="nextq"){quiz.i++;quiz.picked=null;render();return}
  if(t.id==="again"){quiz=null;render();return}
  if(t.id==="markwrong"){[...new Set(quiz.wrong.map(x=>x.w))].forEach(w=>prog[w]="hard");save();quiz=null;render();return}
});
document.addEventListener("keydown",e=>{
  if(mode!=="kart")return;
  if(e.key===" "){e.preventDefault();flipped=!flipped;document.getElementById("flip")?.classList.toggle("open",flipped)}
  if(e.key==="ArrowRight"){ci=(ci+1)%deck.length;flipped=false;render()}
  if(e.key==="ArrowLeft"){ci=Math.max(0,ci-1);flipped=false;render()}
});
render();
</script>

</body></html>
